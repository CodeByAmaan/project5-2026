<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data storage component</title>
    <link rel="icon" href="favicon1.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page">

        <div class="icons">
            <img class="logo" src="logo.svg" alt="Logo Icon">
            <div class="icon-row">
                <div class="color1">
                    <img class="icon" src="document.svg" alt="Document Icon">
                </div>
                <div class="color2">
                    <img class="icon" src="folder.svg" alt="Folder Icon">
                </div>
                <div class="color3">
                    <img class="icon" src="upload.svg" alt="Upload Icon">
                </div>
            </div>
        </div>

        <div class="storage-wrap">
            <div class="leftover">
                <span class="leftover-amount">185</span>
                <span class="leftover-unit">GB LEFT</span>
            </div>
            <div class="storage">
                <p>You've used <span class="remain">815 GB</span> of your storage</p>

                <div class="progress">
                    <div class="progress-fill"></div>
                </div>

                <div class="labels">
                    <span>0 GB</span>
                    <span>1000 GB</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
